name: "CD: Build & Publish"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version YYYY.MM.DD.N; increment N for another release on the same date"
        required: true
        type: string
      prerelease:
        description: "Mark this preview release as a prerelease"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Version
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      cargo_version: ${{ steps.validate.outputs.cargo_version }}
    steps:
      - name: Validate release version
        id: validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, os, re
          from pathlib import Path
          release = os.environ["RELEASE_VERSION"]
          match = re.fullmatch(r"([0-9]{4})\.([0-9]{2})\.([0-9]{2})\.([1-9][0-9]*)", release)
          if not match:
              raise SystemExit("version must be YYYY.MM.DD.N with a positive counter")
          year, month, day, counter = map(int, match.groups())
          datetime.date(year, month, day)
          cargo_version = f"{year}.{month}.{day}+{counter}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_version={release}\n")
              output.write(f"cargo_version={cargo_version}\n")
          PY

  rust-build:
    name: Build Release (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15-intel
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install target standard library
        run: rustup target add ${{ matrix.target }} --toolchain 1.99.1
      - name: Set package version
        env:
          CARGO_VERSION: ${{ needs.validate.outputs.cargo_version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["CARGO_VERSION"]
          path = Path("rust/Cargo.toml")
          text, count = re.subn(r'(?m)^(version\s*=\s*)"[^"]+"$', rf'\g<1>"{version}"', path.read_text(), count=1)
          if count != 1: raise SystemExit("could not update root package version")
          path.write_text(text)
          path = Path("rust/Cargo.lock")
          text, count = re.subn(r'(?ms)(\[\[package\]\]\nname = "proselint-rs"\nversion = ")[^"]+(".*?)(?=\n\[\[package\]\]|\Z)', rf'\g<1>{version}\2', path.read_text(), count=1)
          if count != 1: raise SystemExit("could not update proselint-rs lock entry")
          path.write_text(text)
          PY
      - name: Build locked release binary
        env:
          PROSELINT_RS_RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: cargo +1.99.1 build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Validate binary version
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          RUST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          expected="proselint-rs ${RELEASE_VERSION} (tracks Proselint 0.16.0)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="rust/target/${RUST_TARGET}/release/proselint-rs.exe"; else binary="rust/target/${RUST_TARGET}/release/proselint-rs"; fi
          if [[ "$RUST_TARGET" == "aarch64-apple-darwin" ]]; then
            lipo -archs "$binary" | grep -qw arm64 || { echo "expected ARM64 Mach-O binary"; exit 1; }
            exit 0
          fi
          actual=$("$binary" --version)
          [[ "$actual" == "$expected" ]] || { printf 'expected: %s\nactual: %s\n' "$expected" "$actual"; exit 1; }
      - name: Package Unix executable and checksum
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          RUST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          binary="rust/target/${RUST_TARGET}/release/proselint-rs"
          name="proselint-rs-v${RELEASE_VERSION}-${RUST_TARGET}"
          mkdir -p dist "$name"
          install -m 755 "$binary" "$name/proselint-rs"
          tar -czf "dist/${name}.tar.gz" "$name/proselint-rs"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
      - name: Package Windows executable and checksum
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          RUST_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $name = "proselint-rs-v$env:RELEASE_VERSION-$env:RUST_TARGET"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path $name -Force | Out-Null
          Copy-Item "rust/target/$env:RUST_TARGET/release/proselint-rs.exe" "$name/proselint-rs.exe"
          Compress-Archive -Path "$name/proselint-rs.exe" -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256" -NoNewline
          Remove-Item $name -Recurse -Force
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Tag and Publish Release
    runs-on: ubuntu-24.04
    needs: [validate, rust-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate release assets and checksums
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          mapfile -t checksums < <(find dist -maxdepth 1 -type f -name '*.sha256' | sort)
          [[ ${#archives[@]} -eq 6 && ${#checksums[@]} -eq 6 ]] || {
            echo "expected 6 archives and 6 checksum files; found ${#archives[@]} archives and ${#checksums[@]} checksums"
            exit 1
          }
          for checksum in "${checksums[@]}"; do
            (cd dist && sha256sum --check "${checksum#dist/}")
          done
      - name: Set package version and prepare changelog
        env:
          CARGO_VERSION: ${{ needs.validate.outputs.cargo_version }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["CARGO_VERSION"]
          path = Path("rust/Cargo.toml")
          text, n = re.subn(r'(?m)^(version\s*=\s*)"[^"]+"$', rf'\g<1>"{version}"', path.read_text(), count=1)
          if n != 1: raise SystemExit("could not update root package version")
          path.write_text(text)
          path = Path("rust/Cargo.lock")
          text, n = re.subn(r'(?ms)(\[\[package\]\]\nname = "proselint-rs"\nversion = ")[^"]+(".*?)(?=\n\[\[package\]\]|\Z)', rf'\g<1>{version}\2', path.read_text(), count=1)
          if n != 1: raise SystemExit("could not update proselint-rs lock entry")
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare release v${RELEASE_VERSION}" --no-verify
          fi
      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "v${RELEASE_VERSION}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ needs.validate.outputs.release_version }}
          tag_name: v${{ needs.validate.outputs.release_version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: >-
            Preview release tracking Python Proselint 0.16.0. The current live
            compatibility suite passes 1,464 accepted cases; 11 reference cases
            remain excluded. Compatibility is partial, not a full replacement.
            See the compatibility notes for known CLI differences:
            https://github.com/AieatAssam/proselint-rs/blob/main/rust/docs/COMPATIBILITY.md
          files: dist/*
