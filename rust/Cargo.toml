[package]
name = "proselint-rs"
version = "2026.11.12+1"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
description = "Native Rust port of proselint"

[lib]
name = "proselint_rs"

[[bin]]
name = "proselint-rs"
path = "src/main.rs"

[dependencies]
regex = "1.13.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
serde_stacker = "0.1.14"
