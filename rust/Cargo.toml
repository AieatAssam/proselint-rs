[package]
name = "proselint-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
description = "Native Rust port of proselint"

[lib]
name = "proselint_rs"

[[bin]]
name = "proselint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
