name: "CD: Build & Publish"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version YYYY.MM.DD.N; increment N for another release on the same date"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

jobs:
  version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
    permissions:
      contents: write
    steps:
      - name: "[INIT] Get privileged app token"
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: "[INIT] Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: "[INPUT] Validate release version"
        id: validate
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import re
          from pathlib import Path

          release = os.environ["RELEASE_VERSION"]
          match = re.fullmatch(r"([0-9]{4})\.([0-9]{2})\.([0-9]{2})\.([1-9][0-9]*)", release)
          if not match:
              raise SystemExit("version must be YYYY.MM.DD.N with a positive counter")
          year, month, day, counter = map(int, match.groups())
          try:
              datetime.date(year, month, day)
          except ValueError as error:
              raise SystemExit(f"invalid release date: {error}")

          cargo_version = f"{year}.{month}.{day}+{counter}"
          cargo_toml = Path("rust/Cargo.toml")
          text = cargo_toml.read_text()
          text, count = re.subn(
              r'(?m)^(version\s*=\s*)"[^"]+"$',
              rf'\g<1>"{cargo_version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update root package version in rust/Cargo.toml")
          cargo_toml.write_text(text)

          lock = Path("rust/Cargo.lock")
          lock_text = lock.read_text()
          package = re.compile(
              r'(?ms)(\[\[package\]\]\nname = "proselint-rs"\nversion = ")[^"]+(".*?)(?=\n\[\[package\]\]|\Z)'
          )
          lock_text, count = package.subn(rf'\g<1>{cargo_version}\2', lock_text, count=1)
          if count != 1:
              raise SystemExit("could not update proselint-rs entry in rust/Cargo.lock")
          lock.write_text(lock_text)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_version={release}\n")
              output.write(f"cargo_version={cargo_version}\n")
          PY

      - name: "[INIT] Git Config"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "[INIT] Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "[INIT] Setup Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: amperser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "[VERSION] Bump & Commit"
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: |
          nix develop --command uv version "$RELEASE_VERSION"
          nix develop --command git-cliff -c cliff.toml -u \
          --tag "v${RELEASE_VERSION}" \
          -p CHANGELOG.md

          git commit -am "chore: prepare release v${RELEASE_VERSION}" --no-verify || echo "no changes to commit"

      - name: "[GIT] Create tag"
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin HEAD --tags

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [version]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: "[INIT] Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.release_version }}

      - name: "[INIT] Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "[INIT] Setup Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: amperser
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: "[BUILD] Wheel"
        run: |
          mkdir -p dist
          nix build -L .#wheel
          cp result/*.whl dist/


      - name: "[BUILD] Source dist"
        run: |
          nix build -L .#sdist
          cp result/*.tar.gz dist/

      - name: "[CHANGELOG] Generate release notes"
        run: |
          nix develop --command git-cliff -c cliff.toml \
            --latest --verbose \
            -o dist/RELEASE_NOTES.md

      - name: "[VERIFY] Provenance"
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

      - name: "[UPLOAD] Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/
          if-no-files-found: error

  rust-build:
    name: Build Rust (${{ matrix.target }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: "[INIT] Checkout release tag"
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.release_version }}

      - name: "[INIT] Install pinned Rust toolchain"
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: "[INIT] Install Rust target standard library"
        run: rustup target add ${{ matrix.target }} --toolchain 1.99.1

      - name: "[BUILD] Compile locked release binary"
        run: cargo +1.99.1 build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

      - name: "[PACKAGE] Archive Unix executable"
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
          RUST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          binary="rust/target/${RUST_TARGET}/release/proselint-rs"
          bundle="dist/proselint-rs-v${RELEASE_VERSION}-${RUST_TARGET}"
          mkdir -p "$bundle"
          install -m 755 "$binary" "$bundle/proselint-rs"
          tar -C "$bundle" -czf "${bundle}.tar.gz" proselint-rs

      - name: "[PACKAGE] Archive Windows executable"
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
          RUST_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $bundle = "dist/proselint-rs-v$env:RELEASE_VERSION-$env:RUST_TARGET"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "rust/target/$env:RUST_TARGET/release/proselint-rs.exe" "$bundle/proselint-rs.exe"
          Compress-Archive -Path "$bundle/proselint-rs.exe" -DestinationPath "$bundle.zip" -Force

      - name: "[UPLOAD] Platform executable"
        uses: actions/upload-artifact@v7
        with:
          name: proselint-rs-${{ needs.version.outputs.release_version }}-${{ matrix.target }}
          path: dist/proselint-rs-v${{ needs.version.outputs.release_version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 2

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build, rust-build]
    permissions:
      contents: write
    steps:
      - name: "[INIT] Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "[DOWNLOAD] Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: "[DOWNLOAD] Rust executables"
        uses: actions/download-artifact@v8
        with:
          pattern: proselint-rs-${{ needs.version.outputs.release_version }}-*
          path: dist/
          merge-multiple: true

      - name: "[INPUT] Get input"
        id: input
        run: |
          echo "tag=v${{ needs.version.outputs.release_version }}" >> $GITHUB_OUTPUT
          echo "version=${{ needs.version.outputs.release_version }}" >> $GITHUB_OUTPUT
          echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT

      - name: "[INIT] Move release notes"
        run: mv dist/RELEASE_NOTES.md ./RELEASE_NOTES.md

      - name: "[RELEASE] Create GitHub release"
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.input.outputs.tag }}
          tag_name: ${{ steps.input.outputs.tag }}
          prerelease: ${{ steps.input.outputs.prerelease }}
          body_path: ./RELEASE_NOTES.md
          files: dist/*

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: release
    permissions:
      id-token: write
    steps:
      - name: "[DOWNLOAD] Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: "[INIT] Remove release notes"
        run: rm dist/RELEASE_NOTES.md

      - name: "[PUBLISH] PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
